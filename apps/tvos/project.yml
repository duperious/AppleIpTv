# XcodeGen tanimi. Xcode projesini uretmek icin:
#   brew install xcodegen
#   cd apps/tvos && xcodegen generate && open AppleIpTv.xcodeproj
#
# XcodeGen kullanmak istemiyorsaniz apps/tvos/README.md icindeki
# "Elle proje olusturma" adimlarini izleyin.

name: AppleIpTv
options:
  bundleIdPrefix: com.appleiptv
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  AppleIpTv:
    type: application
    platform: tvOS
    sources:
      - path: AppleIpTv
    info:
      path: AppleIpTv/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.appleiptv.player
        PRODUCT_NAME: AppleIpTv
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "3"
        SUPPORTS_MACCATALYST: NO
